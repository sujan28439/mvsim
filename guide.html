<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニューの説明</title>
</head>
<body>
    <header>
        <h1>マルス券売機シミュレータ</h1>
    </header>
    <h2>メニューの説明</h2>
    <dl>
        <dt>指定席</dt>
        <dd>指定券（特急券、指定席券）を購入するメニューです。とはいえ自由席もこれで選べるので通常はこれを押します。</dd>
        <dt>自由席</dt>
        <dd>自由席特急券、急行券を購入するメニューです。</dd>
        <dt>乗換案内から購入</dt>
        <dd>マルスの乗換案内機能を使って購入できます。</dd>
        <dt>乗車券</dt>
        <dd>乗車券を単品で購入するメニューです。</dd>
    </dl>
    <footer style="text-align: center;">
        <button onclick="window.close()">閉じる</button>
    </footer>
</body>
</html>
